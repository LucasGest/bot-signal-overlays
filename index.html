<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<!-- Sécurité : scripts et styles de ce site seulement, polices Google, connexion au Bot Signal et au chat Twitch (lecture seule) seulement. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src wss://bot-signal-tqps.onrender.com ws://localhost:3000 ws://127.0.0.1:3000 wss://irc-ws.chat.twitch.tv; img-src 'self' data:; base-uri 'none'; form-action 'none'">
<title>Overlay · Bot Signal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&family=Space+Grotesk:wght@500;700&display=swap">
<link rel="stylesheet" href="overlay.css">
</head>
<body>
  <!-- Animation plein écran au déclenchement d'une alerte (F-42) -->
  <div id="intro" class="intro" hidden>
    <div class="waves"><i></i><i></i><i></i><i></i></div>
    <div class="intro-text">
      <div class="intro-kicker" id="intro-kicker"></div>
      <div class="intro-title">SIGNAL</div>
      <div class="intro-sub" id="intro-sub"></div>
    </div>
  </div>

  <!-- Scènes plein écran : debut (commence bientôt), pause, veille (sommeil), fin (fin du stream) -->
  <div id="scene" class="scene" hidden>
    <div class="scene-glow"><i></i><i></i><i></i></div>
    <div class="scene-stars"></div>
    <div class="scene-waves"><i></i><i></i><i></i></div>
    <div class="ev-logo scene-logo"><img class="logo" data-logo="event" src="logo-event.png" alt=""><div class="logo-txt"><span class="ev-small">La Community</span><span class="ev-big">Event</span><span class="ev-num">#2</span><i class="ev-shine"></i></div></div>
    <div class="scene-top"><div class="bot-logo scene-bot"><img class="logo" data-logo="bot" src="logo-bot.png" alt=""><div class="logo-txt"><svg class="bot-mark" viewBox="0 0 40 40" aria-hidden="true"><path class="bm-w" d="M14 22a8.5 8.5 0 0 1 12 0"/><path class="bm-w" d="M10 17.5a14 14 0 0 1 20 0"/><path class="bm-w" d="M6 13a20 20 0 0 1 28 0"/><circle class="bm-dot" cx="20" cy="27" r="3.6"/></svg><span class="bm-name">Signal</span></div></div><div class="scene-clock mono" id="scene-clock"></div></div>
    <!-- Chat Twitch de la chaîne (scène Pause), en lecture seule -->
    <div id="chat" class="chat glass" hidden>
      <div class="kicker">💬 Le chat</div>
      <ul id="chat-list"><li class="empty">Écris dans le chat, ton message s'affiche ici 💬</li></ul>
    </div>
    <div class="scene-main">
      <div class="scene-badge glass" id="scene-badge"></div>
      <div class="kicker" id="scene-kicker"></div>
      <div class="scene-title" id="scene-title"></div>
      <div class="scene-who" id="scene-who"></div>
      <div class="scene-text" id="scene-text"></div>
      <div class="scene-extra" id="scene-extra"></div>
    </div>
    <div class="scene-bar glass" id="scene-bar"></div>
  </div>

  <!-- Scène de live : cadre de la webcam (la webcam d'OBS se place dessous) et bandeau défilant -->
  <div id="cam" class="cam" hidden>
    <div class="cam-frame"></div>
    <div class="ev-logo cam-logo"><img class="logo" data-logo="event" src="logo-event.png" alt=""><div class="logo-txt"><span class="ev-small">La Community</span><span class="ev-big">Event</span><span class="ev-num">#2</span><i class="ev-shine"></i></div></div>
    <div class="cam-tag glass" id="cam-tag"></div>
  </div>
  <div id="ticker" class="ticker glass" hidden>
    <div class="bot-logo ticker-brand"><img class="logo" data-logo="bot" src="logo-bot.png" alt=""><div class="logo-txt"><svg class="bot-mark" viewBox="0 0 40 40" aria-hidden="true"><path class="bm-w" d="M14 22a8.5 8.5 0 0 1 12 0"/><path class="bm-w" d="M10 17.5a14 14 0 0 1 20 0"/><path class="bm-w" d="M6 13a20 20 0 0 1 28 0"/><circle class="bm-dot" cx="20" cy="27" r="3.6"/></svg><span class="bm-name">Signal</span></div></div>
    <div class="ticker-view"><div class="ticker-track" id="ticker-track"></div></div>
  </div>

  <!-- Coin permanent (F-41) + panneaux d'alerte, de vote et de fin -->
  <div id="stack" class="stack">
    <div id="panel" class="panel glass" hidden></div>
    <div id="widget" class="widget glass" hidden></div>
  </div>

  <div id="error" class="error glass" hidden></div>
  <script src="vendor/gsap.min.js"></script>
  <script src="config.js"></script>
  <script src="overlay.js"></script>
  <script src="logos.js"></script>
</body>
</html>
